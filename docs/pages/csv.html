<h1>CSV Viewer</h1>

<input type="file" id="csvFile" class="form-control mb-3">

<button class="btn btn-primary" onclick="parseCSV()">
    Load CSV
</button>

<!-- LOADER -->
<div id="loading" style="display:none;">
    <div class="spinner-border text-primary"></div>
    Loading...
</div>

<!-- COLUMN SELECTOR -->
<div id="columnSelector" class="my-3"></div>

<div id="myGrid5" class="ag-theme-quartz mb-3" style="height: 70vh; width: 100%;">
</div>

<button class="btn btn-primary mb-3" onclick="exportCSV()">
    Export CSV
</button>

<button class="btn btn-primary mb-3" onclick="saveSnapshot()">
    Save Data
</button>
